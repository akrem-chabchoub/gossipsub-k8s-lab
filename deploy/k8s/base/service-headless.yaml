# Headless service: gives each StatefulSet pod a stable DNS name
# (<pod>.gossip-peers.gossip-lab.svc.cluster.local) used for peer discovery.
apiVersion: v1
kind: Service
metadata:
  name: gossip-peers
  labels:
    app.kubernetes.io/part-of: gossip-lab
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/part-of: gossip-lab
  ports:
    - name: libp2p
      port: 4001
      targetPort: 4001
    - name: metrics
      port: 9100
      targetPort: 9100
