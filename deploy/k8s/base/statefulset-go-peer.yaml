apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: go-peer
  labels:
    app.kubernetes.io/part-of: gossip-lab
    gossip.lab/impl: go
spec:
  serviceName: gossip-peers
  podManagementPolicy: Parallel
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/part-of: gossip-lab
      gossip.lab/impl: go
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: gossip-lab
        gossip.lab/impl: go
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: peer
          image: gossip/go-peer:0.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: libp2p
              containerPort: 4001
            - name: metrics
              containerPort: 9100
          env:
            - name: PEER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PEER_NAMES
              value: "go-peer-0,go-peer-1,go-peer-2,go-peer-3,go-peer-4,go-peer-5"
            - name: PUBLISHER_NAME
              value: "go-peer-0"
            - name: PEER_DNS_SUFFIX
              value: ".gossip-peers.gossip-lab.svc.cluster.local"
            - name: TOPIC
              value: "lab/v1"
            - name: PUBLISH_RATE
              value: "10"
            - name: PAYLOAD_BYTES
              value: "1024"
            - name: LISTEN_PORT
              value: "4001"
            - name: METRICS_PORT
              value: "9100"
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
