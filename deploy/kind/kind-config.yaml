# Single-node cluster: all pods share one host clock, so publish-to-receive
# latency is comparable across peers (see REPORT.md, "Measurement assumptions").
# Default CNI is disabled because kindnet does not enforce NetworkPolicy.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gossip-lab
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
