# Prometheus (chart prometheus-community/prometheus 29.47.2, app v3.16.0).
# Lab-only: no persistence, short retention. Peer scraping is pod-discovery based, so
# no pod IPs are hard-coded.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: true
server:
  persistentVolume:
    enabled: false
  retention: 2d
  global:
    scrape_interval: 5s
    evaluation_interval: 5s
    scrape_timeout: 4s
extraScrapeConfigs: |
  - job_name: gossip-peers
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [gossip-lab, gossip-mixed, gossip-lab-py]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
        regex: gossip-lab|gossip-mixed|gossip-lab-check
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
