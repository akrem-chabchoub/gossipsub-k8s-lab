# Vector agent (chart vector/vector 0.61.0) ships gossip pod logs to VictoriaLogs.
# Source: CRI log files of the gossip namespaces, read directly from /var/log/pods.
# The kubernetes_logs source emitted nothing in this kind setup (see tradeoffs.md D7).
role: Agent
service:
  enabled: false
customConfig:
  data_dir: /vector-data-dir/files
  api:
    enabled: false
  sources:
    gossip_files:
      type: file
      include:
        - /var/log/pods/gossip-*/*/*.log
      read_from: beginning
  transforms:
    parse_cri:
      type: remap
      inputs: [gossip_files]
      source: |
        # CRI line: "<timestamp> <stream> <P|F> <message>"
        parts = parse_regex(string(.message) ?? "", r'^(?P<ts>\S+) (?P<stream>\S+) (?P<flag>\S+) (?P<msg>.*)$') ?? {}
        if is_string(parts.msg) { .message = parts.msg }
        # Path: /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log
        path = parse_regex(string(.file) ?? "", r'/var/log/pods/(?P<ns>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/') ?? {}
        .kubernetes = {"pod_namespace": path.ns, "pod_name": path.pod, "container_name": path.container}
    parse_peer_json:
      type: remap
      inputs: [parse_cri]
      source: |
        parsed, err = parse_json(string(.message) ?? "")
        if err == null && is_object(parsed) {
          . = merge(., parsed) ?? .
        }
  sinks:
    victorialogs:
      type: elasticsearch
      inputs: [parse_peer_json]
      endpoints:
        - "http://victoria-logs-victoria-logs-single-server.observability.svc.cluster.local:9428/insert/elasticsearch/"
      query:
        _time_field: time
        _msg_field: message
        _stream_fields: "kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name"
      api_version: v8
      mode: bulk
      compression: gzip
      healthcheck:
        enabled: false
      encoding:
        timestamp_format: rfc3339
